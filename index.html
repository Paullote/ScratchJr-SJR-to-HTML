<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Projeto Scratch Jr</title>
  <!-- Biblioteca para ler o ficheiro ZIP no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; }
    #palco { 
      width: 480px; 
      height: 360px; 
      border: 3px solid #333; 
      position: relative; 
      overflow: hidden; 
      background-size: cover;
      background-position: center;
      background-color: #fff;
    }
    .personagem { position: absolute; transform-origin: center; }
  </style>
</head>
<body>

  <h2>Player Web Scratch Jr</h2>
  <input type="file" id="zipInput" accept=".zip,.sjb" />
  <br>
  <div id="palco"></div>

  <script>
    document.getElementById('zipInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const zip = await JSZip.loadAsync(file);
      const palco = document.getElementById('palco');
      palco.innerHTML = ''; // Limpa o palco

      // 1. Ler o ficheiro data.json
      const jsonFile = zip.file("project/data.json") || zip.file("data.json");
      if (!jsonFile) {
        alert("Ficheiro data.json não encontrado no pacote!");
        return;
      }
      
      const jsonText = await jsonFile.async("text");
      const projectData = JSON.parse(jsonText);

      // 2. Carregar o Fundo (Background)
      const bgFile = zip.file("project/backgrounds/Desert.svg") || zip.file("backgrounds/Desert.svg");
      if (bgFile) {
        const bgBlob = await bgFile.async("blob");
        palco.style.backgroundImage = `url(${URL.createObjectURL(bgBlob)})`;
      }

      // 3. Renderizar as Personagens no Palco
      const page = projectData.pages ? projectData.pages[0] : projectData;
      const sprites = page.sprites || page.objects || [];

      for (const sprite of sprites) {
        // Encontrar o ficheiro SVG correspondente
        const spriteFile = zip.file(`project/characters/${sprite.md5}`) || zip.file(`characters/${sprite.md5}`);
        
        if (spriteFile) {
          const blob = await spriteFile.async("blob");
          const img = document.createElement('img');
          img.src = URL.createObjectURL(blob);
          img.className = 'personagem';
          
          // Ajustar posições x e y (convertendo a grelha do Scratch Jr para pixels)
          const posX = (sprite.x || 0) * (480 / 24);
          const posY = (sprite.y || 0) * (360 / 18);
          
          img.style.left = `${posX}px`;
          img.style.top = `${posY}px`;
          img.style.width = `${(sprite.scale || 1) * 50}px`;

          palco.appendChild(img);
        }
      }
    });
  </script>
</body>
</html>
