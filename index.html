<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScratchJr SJR Player</title>
  <!-- Biblioteca para descompactar arquivos .sjr / .zip no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #89b4fa;
    }

    .upload-container {
      margin-bottom: 20px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .btn-upload {
      background-color: #89b4fa;
      color: #11111b;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
      display: inline-block;
    }

    .btn-upload:hover {
      background-color: #b4befe;
    }

    /* Proporção padrão do palco do ScratchJr (4:3) */
    #stage {
      width: 640px;
      height: 480px;
      background-color: #ffffff;
      border: 4px solid #45475a;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .background-img {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      object-fit: cover;
      z-index: 1;
    }

    .character-img {
      position: absolute;
      z-index: 2;
      transform-origin: center center;
      user-select: none;
      cursor: pointer;
      transition: transform 0.1s linear;
    }

    #info {
      margin-top: 15px;
      font-size: 14px;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <h1>Leitor e Executador de .SJR</h1>
  
  <div class="upload-container">
    <label for="sjrFile" class="btn-upload">Selecionar arquivo .sjr</label>
    <input type="file" id="sjrFile" accept=".sjr,.zip">
  </div>

  <!-- Palco onde o projeto do ScratchJr será exibido -->
  <div id="stage"></div>

  <div id="info">Selecione um projeto ScratchJr para visualizar no palco.</div>

<script>
  const fileInput = document.getElementById('sjrFile');
  const stage = document.getElementById('stage');
  const info = document.getElementById('info');

  fileInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    info.innerText = "Carregando e descompactando arquivo .sjr...";
    stage.innerHTML = "";

    try {
      const zip = await JSZip.loadAsync(file);

      // Busca flexível pelo arquivo data.json (ignora se há barras ou pastas na frente)
      const jsonFiles = zip.file(/data\.json$/i);
      
      if (!jsonFiles || jsonFiles.length === 0) {
        alert("Arquivo data.json não foi encontrado dentro do .sjr!");
        info.innerText = "Erro: Estrutura do arquivo .sjr inválida.";
        return;
      }

      // Lê o conteúdo do primeiro data.json encontrado
      const jsonText = await jsonFiles[0].async("string");
      const projectData = JSON.parse(jsonText);

      info.innerText = "Projeto carregado! Processando páginas e elementos...";
      await renderPage(projectData, zip);

    } catch (err) {
      console.error(err);
      alert("Erro ao processar o arquivo .sjr.");
      info.innerText = "Erro ao processar o arquivo.";
    }
  });

  // Função auxiliar para localizar imagens e sons dentro do ZIP de forma flexível
  function getZipFile(zip, filename) {
    if (!filename) return null;
    const cleanName = filename.split('/').pop(); // Extrai apenas o nome do arquivo
    const matches = zip.file(new RegExp(cleanName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'));
    return matches.length > 0 ? matches[0] : null;
  }

  async function renderPage(data, zip) {
    let pages = typeof data.pages === 'string' ? JSON.parse(data.pages) : data.pages;

    if (!pages && data.page0) {
      // Suporte para versões alternativas onde as páginas são gravadas como page0, page1...
      pages = Object.keys(data)
        .filter(k => k.startsWith('page'))
        .map(k => typeof data[k] === 'string' ? JSON.parse(data[k]) : data[k]);
    }

    if (!pages || pages.length === 0) {
      info.innerText = "Nenhuma página encontrada no projeto.";
      return;
    }

    const currentPage = pages[0];

    // 1. Carregar plano de fundo (Background)
    if (currentPage.bk) {
      const bgFile = getZipFile(zip, currentPage.bk);
      if (bgFile) {
        const bgBlob = await bgFile.async("blob");
        const bgUrl = URL.createObjectURL(bgBlob);

        const bgImg = document.createElement('img');
        bgImg.src = bgUrl;
        bgImg.className = 'background-img';
        stage.appendChild(bgImg);
      }
    }

    // 2. Carregar os personagens/elementos (Sprites)
    if (currentPage.sprites) {
      for (const sprite of currentPage.sprites) {
        const spriteMd5 = sprite.md5 || sprite.shape;
        if (!spriteMd5) continue;

        const charFile = getZipFile(zip, spriteMd5);

        if (charFile) {
          const charBlob = await charFile.async("blob");
          const charUrl = URL.createObjectURL(charBlob);

          const charImg = document.createElement('img');
          charImg.src = charUrl;
          charImg.className = 'character-img';

          // Proporções de renderização do ScratchJr (640x480 no palco de exibição)
          const scaleX = 640 / 480; 
          const scaleY = 480 / 360;

          const x = (sprite.x || 0) * scaleX;
          const y = (sprite.y || 0) * scaleY;
          const scale = (sprite.scale || 100) / 100;

          charImg.style.left = `${x}px`;
          charImg.style.top = `${y}px`;
          charImg.style.transform = `scale(${scale})`;

          // Animação simples de toque no personagem
          charImg.addEventListener('click', () => {
            charImg.style.transform = `scale(${scale * 1.2})`;
            setTimeout(() => {
              charImg.style.transform = `scale(${scale})`;
            }, 200);
          });

          stage.appendChild(charImg);
        }
      }
    }

    info.innerText = "Projeto exibido com sucesso!";
  }
</script>
</body>
</html>
