<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador Scratch Jr</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 15px; font-size: 20px; }
    
    .caixa-upload {
      margin-bottom: 15px;
      background: #2a2a2a;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px dashed #555;
    }

    #palco {
      width: 480px;
      height: 360px;
      border: 3px solid #ffffff;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      background-color: #ffffff;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .ator {
      position: absolute;
      transform-origin: center center;
      user-select: none;
    }

    #log {
      width: 480px;
      height: 100px;
      background: #000000;
      color: #00ff66;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      overflow-y: auto;
      text-align: left;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <h1>Visualizador Scratch Jr (.sjr)</h1>

  <div class="caixa-upload">
    <input type="file" id="zipInput" accept=".sjr,.zip,.sjb" />
  </div>

  <div id="palco"></div>
  <div id="log">> Seleciona um ficheiro .sjr para carregar...</div>

  <script>
    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += "<br>> " + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Procura lista de atores no JSON
    function extrairSprites(pagina) {
      if (!pagina) return [];
      if (Array.isArray(pagina.sprites)) return pagina.sprites;
      if (Array.isArray(pagina.objects)) return pagina.objects;
      if (Array.isArray(pagina.pageObjects)) return pagina.pageObjects;
      if (Array.isArray(pagina.actors)) return pagina.actors;

      for (let chave in pagina) {
        if (Array.isArray(pagina[chave]) && pagina[chave].length > 0) {
          const item = pagina[chave][0];
          if (item && (item.md5 || item.shape || item.id || item.x !== undefined)) {
            return pagina[chave];
          }
        }
      }
      return [];
    }

    // Procura o nome do fundo
    function extrairFundo(pagina) {
      if (!pagina) return "Desert.svg";
      if (typeof pagina.background === 'string') return pagina.background;
      if (typeof pagina.bg === 'string') return pagina.bg;
      if (pagina.background && pagina.background.md5) return pagina.background.md5;
      return "Desert.svg";
    }

    document.getElementById('zipInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('log').innerHTML = "A analisar " + file.name + "...";
      const palco = document.getElementById('palco');
      palco.innerHTML = '';
      palco.style.backgroundImage = 'none';

      try {
        const zip = await JSZip.loadAsync(file);
        const listaFicheiros = Object.keys(zip.files);

        // Encontrar o ficheiro .json
        const caminhoJson = listaFicheiros.find(k => k.toLowerCase().endsWith('.json'));
        if (!caminhoJson) {
          log("ERRO: Nenhum ficheiro .json encontrado no pacote!");
          return;
        }

        const jsonText = await zip.file(caminhoJson).async("text");
        const projectData = JSON.parse(jsonText);
        log("Ficheiro data.json lido com sucesso.");

        // Identificar a página inicial
        let page = projectData;
        if (Array.isArray(projectData.pages) && projectData.pages.length > 0) {
          page = projectData.pages[0];
        } else if (Array.isArray(projectData.pageList) && projectData.pageList.length > 0) {
          page = projectData.pageList[0];
        }

        function obterFicheiro(nome) {
          if (!nome) return null;
          const nomeLimpo = nome.split('/').pop().toLowerCase();
          const caminho = listaFicheiros.find(k => k.toLowerCase().endsWith(nomeLimpo));
          return caminho ? zip.file(caminho) : null;
        }

        // 1. Carregar Fundo
        const bgNome = extrairFundo(page);
        const bgEntry = obterFicheiro(bgNome) || obterFicheiro("Desert.svg");
        if (bgEntry) {
          const bgBlob = await bgEntry.async("blob");
          palco.style.backgroundImage = `url(${URL.createObjectURL(bgBlob)})`;
          log("Cenário carregado: " + bgEntry.name.split('/').pop());
        }

        // 2. Carregar Atores
        const sprites = extrairSprites(page);
        log(`Personagens detetadas: ${sprites.length}`);

        sprites.forEach((sprite, idx) => {
          const nomeImg = sprite.md5 || sprite.shape || sprite.img || "";
          const imgEntry = obterFicheiro(nomeImg);

          if (imgEntry) {
            imgEntry.async("blob").then(blob => {
              const img = document.createElement('img');
              img.src = URL.createObjectURL(blob);
              img.className = 'ator';

              const gridX = parseFloat(sprite.x) || 12;
              const gridY = parseFloat(sprite.y) || 9;

              let escala = parseFloat(sprite.scale) || 100;
              if (escala > 5) escala = escala / 100;

              img.style.left = `${gridX * 20}px`;
              img.style.top = `${gridY * 20}px`;
              img.style.transform = `translate(-50%, -50%) scale(${escala})`;

              palco.appendChild(img);
            });
            log(`Ator ${idx + 1}: ${nomeImg}`);
          }
        });

      } catch (err) {
        log("ERRO AO ABRIR: " + err.message);
      }
    });
  </script>
</body>
</html>
